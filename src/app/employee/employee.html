<div class="border-1 w-[350px] p-4 border-gray-200 flex flex-col gap-3 rounded-lg shadow-sm">
  <h3 class="text-gray-700">
    Name : <span class="text-gray-500">{{ employee.name }}</span>
  </h3>
  <h3 class="text-gray-700">
    Departement : <span class="text-gray-500">{{ employee.departement }}</span>
  </h3>
  <h3 class="text-gray-700">
    Level : <span class="text-gray-500">{{ employee.level | level }}</span>
  </h3>
</div>
