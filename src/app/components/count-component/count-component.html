@let utils = users();
<div class="flex flex-col gap-4">
  @for (item of utils; track item.id) {
    <div class="bg-green-200">
      <h2>Id: {{ item.id }}</h2>
      <h2>Name : {{ item.name }}</h2>
      <button class="bg-blue-300 p-4 rounded-full cursor-pointer" (click)="deleteUser(item.id)">
        select
      </button>
    </div>
    <br />
  }
</div>
