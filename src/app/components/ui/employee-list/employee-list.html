<div class="p-6 bg-gray-100">
  <div class="max-w-4xl bg-white rounded-2xl shadow-lg overflow-hidden">
    <table class="w-full text-left border-collapse">
      <!-- Header -->
      <thead class="bg-blue-500 text-white">
        <tr>
          <th class="p-4 font-semibold">Name</th>
          <th class="p-4 font-semibold">Level</th>
          <th class="p-4 font-semibold text-center">Actions</th>
        </tr>
      </thead>

      <!-- Body -->
      <tbody class="divide-y">
        @let list = employees();

        @for (employee of list; track employee.id) {
          <tr class="hover:bg-gray-50 transition">
            <td class="p-4 font-medium text-gray-800">{{ employee.name }}</td>
            <td class="p-4 text-gray-600">{{ employee.level | level }}</td>
            <td class="p-4 flex gap-2 justify-center">
              <button
                class="px-3 py-1 text-sm bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition"
              >
                Edit
              </button>

              <button
                class="px-3 py-1 text-sm bg-red-500 text-white rounded-lg hover:bg-red-600 transition"
                (click)="handleClickDelete(employee.id)"
              >
                Delete
              </button>

              <button
                class="px-3 py-1 text-sm bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition"
                (click)="handleClickDetail(employee.id)"
              >
                Details
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td>Aucun data</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
