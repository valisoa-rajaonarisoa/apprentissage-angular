<h2 class="text-green-500">
  Hello {{ title }} vous avez <span class="text-red-500">{{ age + 1 }} </span> ans
</h2>

<div class="mt-5 bg-red-50 w-[200px] p-4">
  <h3>CLICK EVENT BEDING</h3>
  <h3>{{ counter }}</h3>

  <button (click)="Increment()" class="py-2 px-4 bg-blue-200">click</button>
</div>

<!-- //TEMPLATE VARIABLES  -->
<div class="mt-5 bg-yellow-50 w-[300px] p-4 flex flex-col gap-5">
  <h3>TEMPLATE VARIABLES</h3>

  <input
    #InputText
    (input)="OnEditText(InputText.value)"
    type="text"
    placeholder="entrez votre text"
  />

  <!-- //affichage  -->
  <h4>
    Valeur: <span class="text-green-400"> {{ text }}</span>
  </h4>
</div>

<!-- //  ATTRIBUTE BEDING  -->
<div class="mt-5 bg-green-100 w-[300px] p-4 flex flex-col gap-5">
  <h2 class="mb-5">ATTRIBUTE BEDING</h2>
  <p [class]="status">Message ...</p>

  <div class="flex gap-4">
    <button
      (click)="onChangeColor('error')"
      class="px-4 py-2 bg-blue-100 rounded-lg text-blue-400 cursor-pointer"
    >
      Error
    </button>

    <button
      (click)="onChangeColor('sucess')"
      class="px-4 py-2 bg-blue-100 rounded-lg text-blue-400 cursor-pointer"
    >
      Success
    </button>
  </div>
</div>



<div class="mt-5 bg-yellow-50 w-[300px] p-4 flex flex-col gap-5">
  <h3>Input type password</h3>

  <input [type]="textType" placeholder="entrez votre text" />

  <button (click)="onChangeType()" class="bg-blue-100">changer le type</button>
</div>
